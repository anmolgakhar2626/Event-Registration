spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eventdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

# ── JWT ──
app:
  jwt:
    secret: YTlkMzI1NjA5ZWJhNDhiNDk1MmI1OTRmZTE0MTEzYzA3ZjNiNGExNjhmZWExMzI5ZjQ2ZDk5MzllZTI4NWQwMg==
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000     # 7 days
  email-verify:
    ttl-minutes: 15
  password-reset:
    ttl-minutes: 30
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100

server:
  port: 8080

logging:
  level:
    com.example.eventRegisteration: DEBUG
    org.springframework.security: DEBUG
